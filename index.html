<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subway Runner (Web)</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      background: linear-gradient(#ff8844, #444);
      border: 3px solid #fff;
    }
    #info {
      position: absolute;
      top: 10px;
      text-align: center;
      width: 100%;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="info">⬅️ ➡️ Move | Dodge Obstacles | Refresh to Restart</div>
  <canvas id="game" width="360" height="640"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const lanes = [80, 180, 280];
    let laneIndex = 1;

    const player = {
      x: lanes[laneIndex],
      y: 500,
      width: 40,
      height: 40
    };

    let obstacles = [];
    let baseSpeed = 4;
    let speed = baseSpeed;
    let score = 0;
    let obstacleInterval = 1200;

    function spawnObstacle() {
      let lane;

      // Avoid impossible obstacle stacking
      const lastObstacle = obstacles[obstacles.length - 1];
      if (lastObstacle && lastObstacle.y < 150) {
        // Do not spawn in the same lane as last obstacle if it's too close
        const safeLanes = lanes.filter(l => l !== lastObstacle.x);
        lane = safeLanes[Math.floor(Math.random() * safeLanes.length)];
      } else {
        lane = lanes[Math.floor(Math.random() * 3)];
      }

      obstacles.push({
        x: lane,
        y: -60,
        width: 50,
        height: 50
      });
    }

    function drawPlayer() {
      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(player.x - 20, player.y, player.width, player.height);
    }

    function drawObstacle(o) {
      ctx.fillStyle = "#ff3333";
      ctx.fillRect(o.x - 25, o.y, o.width, o.height);
    }

    function collisionRect(a, b) {
      return (
        a.x - 20 < b.x + b.width &&
        a.x + 20 > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function gameOver() {
      alert("Game Over! Score: " + score);
      document.location.reload();
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlayer();

      obstacles.forEach((o, i) => {
        o.y += speed;
        drawObstacle(o);
        if (collisionRect(player, o)) gameOver();
        if (o.y > canvas.height) obstacles.splice(i, 1);
      });

      // Increase score over time
      score++;
      ctx.fillStyle = "white";
      ctx.fillText("Score: " + score, 10, 20);

      // Gradually increase speed every 100 points
      speed = baseSpeed + Math.floor(score / 100) * 0.5;

      requestAnimationFrame(update);
    }

    // Spawn obstacles
    setInterval(spawnObstacle, obstacleInterval);

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && laneIndex > 0) laneIndex--;
      if (e.key === "ArrowRight" && laneIndex < 2) laneIndex++;
      player.x = lanes[laneIndex];
    });

    update();
  </script>
</body>
</html>
